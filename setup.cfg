[metadata]
name = torch-log-wmse
version = attr: torch_log_wmse.__version__
author = Christopher Landschoot
author_email = crlandschoot@gmail.com
license = Apache License 2.0
description = logWMSE is an audio quality metric & loss function with support for digital silence target. Useful for training and evaluating audio source separation systems.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/crlandsc/torch-log-wmse
project_urls =
    Bug Tracker = https://github.com/crlandsc/torch-log-wmse/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Topic :: Multimedia :: Sound/Audio
    Topic :: Scientific/Engineering :: Artificial Intelligence
license_files =
    LICENSE
    NOTICE

[options]
include_package_data = True
packages =
    torch_log_wmse
python_requires = >=3.9
install_requires =
    torch>=2.0
    torchaudio>=2.0

[options.package_data]
# py.typed is what makes the type hints visible to mypy and pyright (PEP 561). It is easy to add
# the file and forget the packaging, which fails silently - the wheel assertion in pypi.yml
# requires it for exactly that reason.
torch_log_wmse =
    filter_ir.f32
    py.typed